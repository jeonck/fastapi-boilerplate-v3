[project]
name = "fastapi-boilerplate-v3"
version = "0.1.0"
description = "FastAPI Boilerplate with FastAPI Users, CrudRouter, Limiter and Cache"
authors = [
    {name = "Developer", email = "developer@example.com"}
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    # Auth - FastAPI Users
    "fastapi-users[sqlalchemy]>=14.0.0",
    # CRUD - FastAPI-CrudRouter (patched for Pydantic v2 in app/core/crudrouter_compat.py)
    "fastapi-crudrouter>=0.8.6",
    # Rate limiting - FastAPI-Limiter (pyrate-limiter based, Redis optional)
    "fastapi-limiter>=0.2.0",
    # Caching - FastAPI-Cache
    "fastapi-cache2>=0.2.2",
    # Redis client (used only when REDIS_URL is set)
    "redis>=5.0.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # fastapi-crudrouter still calls Pydantic v1 style `.dict()`
    "ignore::DeprecationWarning:fastapi_crudrouter.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
